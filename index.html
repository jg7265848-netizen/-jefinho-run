<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jefinho Run | Performance & Running</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #ffffff;
    color: #111111;
}

/* =========================
   HEADER
========================= */

header {
    background: #ffffff;
    border-bottom: 1px solid #e6e6e6;
    min-height: 74px;
    padding: 15px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 1px;
}

.logo span {
    font-weight: 400;
}

nav {
    display: flex;
    align-items: center;
    gap: 25px;
}

nav a {
    color: #111111;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
}

/* =========================
   CARRINHO HEADER
========================= */

.cart-button {
    background: #111111;
    color: #ffffff;
    border: none;
    padding: 11px 16px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
}

.cart-count {
    background: #ffffff;
    color: #111111;
    border-radius: 50%;
    padding: 2px 7px;
    margin-left: 4px;
}

/* =========================
   HERO
========================= */

.hero {
    min-height: 520px;

    background:
        linear-gradient(rgba(0,0,0,0.60), rgba(0,0,0,0.60)),
        url('https://images.unsplash.com/photo-1530549387789-4c1017266635?auto=format&fit=crop&w=1600&q=85');

    background-size: cover;
    background-position: center;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
    padding: 30px;

    color: #ffffff;
}

.hero-small {
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 18px;
    color: #dddddd;
}

.hero h1 {
    font-size: 52px;
    font-weight: 800;
    margin-bottom: 18px;
}

.hero p {
    max-width: 620px;
    font-size: 17px;
    line-height: 1.7;
    color: #eeeeee;
    margin-bottom: 32px;
}

.hero-btn {
    background: #ffffff;
    color: #111111;
    padding: 15px 36px;
    border-radius: 3px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
}

/* =========================
   PRODUTOS
========================= */

.container {
    max-width: 1200px;
    margin: 80px auto;
    padding: 0 25px;
}

.section-header {
    text-align: center;
    margin-bottom: 45px;
}

.section-header span {
    font-size: 11px;
    letter-spacing: 4px;
    color: #777777;
    text-transform: uppercase;
}

.section-header h2 {
    font-size: 34px;
    margin-top: 12px;
    font-weight: 800;
}

.section-header p {
    margin-top: 10px;
    color: #777777;
    font-size: 14px;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 28px;
}

.product-card {
    background: #ffffff;
    border: 1px solid #e3e3e3;
    overflow: hidden;
    border-radius: 8px;
}

.product-card img {
    width: 100%;
    height: 290px;
    object-fit: cover;
    display: block;
}

.product-info {
    padding: 24px;
}

.product-category {
    font-size: 10px;
    letter-spacing: 2px;
    color: #888888;
    text-transform: uppercase;
    margin-bottom: 9px;
}

.product-info h3 {
    font-size: 18px;
    margin-bottom: 13px;
}

.price {
    font-size: 21px;
    font-weight: 800;
    margin-bottom: 20px;
}

.btn-buy {
    display: block;
    width: 100%;
    padding: 14px;
    text-align: center;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    border-radius: 3px;
    margin-bottom: 9px;
    cursor: pointer;
}

.btn-black {
    background: #111111;
    color: #ffffff;
    border: 1px solid #111111;
}

.btn-white {
    background: #ffffff;
    color: #111111;
    border: 1px solid #111111;
}

/* =========================
   PIX
========================= */

.pix-test {
    background: #f5f5f5;
    border: 1px
